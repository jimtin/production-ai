name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GL_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Validate skill structure
        run: ./scripts/validate.sh

      - name: Run skill script tests
        run: |
          shopt -s nullglob globstar
          files=(skills/**/scripts/*.test.mjs)
          if [ ${#files[@]} -gt 0 ]; then node --test "${files[@]}"; else echo "no script tests"; fi

      - name: Privacy scan (fail closed)
        run: REQUIRE_GITLEAKS=1 ./scripts/privacy-scan.sh
